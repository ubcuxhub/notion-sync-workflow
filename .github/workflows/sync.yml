# Reusable workflow called by each source repo. See docs/caller-workflow.yml.
#
# The action lives in this same repo, referenced by tag. That reference is what
# the org-level "Accessible from repositories owned by the organization" setting
# permits — a plain actions/checkout of this private repo from a caller would
# need a PAT, which is exactly the extra secret this design avoids.
name: Notion sync (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: Version of notion-sync-workflow to run
        required: false
        type: string
        default: v1

jobs:
  sync:
    runs-on: ubuntu-latest
    # Only `contents: read`. A called workflow cannot request more than the
    # caller repo's default token grants, and GitHub's restricted default is
    # contents + packages read — so asking for `pull-requests: read` there fails
    # the whole run at startup, before any log exists. We don't need it: the PR
    # data comes from the event payload, and the one API read (the GraphQL
    # review decision) is public data on a public repo.
    #
    # A private source repo would need `pull-requests: read` here AND its
    # default workflow permissions set to allow it.
    permissions:
      contents: read
    steps:
      - name: Sync PR to Notion
        uses: ubcuxhub/notion-sync-workflow@v1
        with:
          mode: event
        env:
          # All three are secrets, not vars. ubcuxhub is a personal account, so
          # there is no org scope — and `secrets: inherit` passes only secrets
          # from the caller, not variables. The db ids are not sensitive; this is
          # about delivery, not secrecy.
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TICKETS_DB: ${{ secrets.NOTION_TICKETS_DB }}
          NOTION_PR_DB: ${{ secrets.NOTION_PR_DB }}
          GITHUB_TOKEN: ${{ github.token }}
